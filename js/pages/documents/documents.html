  <div class="card noprint"><h2>Nouveau document</h2>
    <form class="g" onsubmit="return false">
      <div><label>Type</label><select id="d_type"><option>Facture</option><option>Reçu</option><option>Devis</option></select></div>
      <div><label>Date</label><input type="date" id="d_date"></div>
      <div><label>Client</label><input id="d_cli" placeholder="Nom du client"></div>
      <div><label>Adresse / contact client</label><input id="d_adr"></div>
      <div><label>Devise</label><select id="d_cur"><option>USD</option><option>CDF</option></select></div>
      <div><label>TVA (%)</label><input type="number" id="d_tva" value="0" min="0" step="0.1"></div>
      <div><label>Téléphone client</label><input id="d_tel" type="tel"></div>
      <div><label>Mode de paiement</label><select id="d_mode"><option>Espèces</option><option>Mobile money</option><option>Virement</option><option>Chèque</option><option>À crédit</option></select></div>
      <div><label>Statut</label><select id="d_stat"><option>Payée</option><option>Non payée</option></select></div>
      <div><label>Vendeur</label><input id="d_vend"></div>
      <div><label>Date limite de paiement</label><input type="date" id="d_due"></div>
    </form>
    <h2 style="margin-top:16px">Lignes</h2>
    <div class="lines" id="lines"></div>
    <datalist id="prod-list"></datalist>
    <p id="lie-note" hidden style="margin:4px 0 0;font-size:13px;color:var(--mut)">Une ligne encadrée en vert est reliée au stock : sa quantité sera retirée du stock à l’enregistrement.</p>
    <div class="tools">
      <button class="btn ghost sm" id="addl">Ajouter une ligne</button>
      <button class="btn" id="print">Imprimer / enregistrer en PDF</button>
      <button class="btn gold" id="save">Enregistrer</button>
      <button class="btn" id="wa" style="background:#25D366;color:#073b1c">Envoyer l’image (WhatsApp…)</button>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="card noprint" style="margin-top:16px"><h2>Historique des documents</h2>
    <div class="tools"><input id="h_q" placeholder="N° ou client…" style="width:auto"><select id="h_t" style="width:auto"><option value="">Tous</option><option value="facture">Factures</option><option value="recu">Reçus</option><option value="devis">Devis</option></select><input type="month" id="h_m" style="width:auto"><button class="btn sm" id="ph">Imprimer la liste</button></div>
    <div class="tw"><table><thead><tr><th>N°</th><th>Client</th><th>Date</th><th class="n">Total</th><th></th></tr></thead><tbody id="dh"></tbody></table></div></div>
