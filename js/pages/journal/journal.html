  <div class="card"><h2>Nouvelle opération</h2>
    <form class="g" id="tf">
      <div><label>Type</label><select id="t_type"><option value="in">Entrée</option><option value="out">Sortie</option></select></div>
      <div><label>Date</label><input type="date" id="t_date" required></div>
      <div><label>Catégorie</label><select id="t_cat"></select></div>
      <div><label>Libellé</label><input id="t_desc" required placeholder="ex. Vente 20 kg poivre"></div>
      <div><label>Client / fournisseur</label><input id="t_party"></div>
      <div><label>Montant</label><input type="number" id="t_amt" step="0.01" min="0" required></div>
      <div><label>Devise</label><select id="t_cur"><option>USD</option><option>CDF</option></select></div>
      <div><button class="btn gold" type="submit">Ajouter</button></div>
    </form>
  </div>
