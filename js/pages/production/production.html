<div class="card"><h2>Nouvelle production</h2>
  <form class="g" id="pf">
    <div><label>Produit fini</label><select id="p_prod" required></select></div>
    <div><label>Quantité prévue <span id="p_unit2"></span></label><input type="number" id="p_prevue" min="0" step="any" placeholder="facultatif"></div>
    <div><label>Quantité produite <span id="p_unit"></span></label><input type="number" id="p_qte" min="0" step="any" required></div>
    <div><label>Poids par unité (g)</label><input type="number" id="p_poids" min="0" step="any" placeholder="ex. 50"></div>
    <div><label>N° de lot</label><input id="p_lot" placeholder="ex. L20261123-01"></div>
    <div><label>Produit par (équipe ou personne)</label><input id="p_par" list="p_pars" required placeholder="ex. Hardi"><datalist id="p_pars"></datalist></div>
    <div><label>Date</label><input type="date" id="p_date" required></div>
    <div><label>Note</label><input id="p_note" placeholder="remarque"></div>
    <div><button class="btn gold" type="submit">Enregistrer la production</button></div>
  </form>
  <div id="p_prev"></div>
  <div id="p_sum"></div>
</div>
<div class="card"><h2>Historique des productions</h2>
  <div class="tools"><button class="btn ghost sm" id="p_csv">Exporter CSV</button><button class="btn sm" id="p_wa" style="background:#25D366;color:#073b1c">WhatsApp</button></div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Production</th><th class="n">Quantité</th><th>Équipe</th><th></th></tr></thead><tbody id="p_tb"></tbody></table></div>
</div>
